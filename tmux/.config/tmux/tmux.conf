# True color settings
set -g default-terminal "tmux-256color" # For correct colours in LazyVim
set -ag terminal-overrides ",$TERM:Tc"

# Required for 'autoread' in LazyVim
set-option -g focus-events on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open new windows and panes in current working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind b display-popup -d "#{pane_current_path}" -w 70% -h 60% -E "zsh"
bind y display-popup -d '#{pane_current_path}' -w 70% -w 60% -E 'tmux new-session yazi \; set status off' # See: https://github.com/sxyazi/yazi/issues/2308#issuecomment-2731102243

# DESIGN TWEAKS

set -g theme terminal

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#cba6f7'

# copy mode highlighting
setw -g mode-style 'fg=#1e1e2e bg=#cba6f7 bold'

# panes
set -g pane-border-style 'fg=#45475a'
set -g pane-border-lines double
set -g pane-active-border-style 'fg=#cba6f7'
set -g pane-border-indicators both

# Show the running command in each pane's border
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

set -g popup-style 'bg=default'
set -g popup-border-style 'fg=#cba6f7'
set -g popup-border-lines rounded

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#cdd6f4'

set -g status-left ' #{session_name} '
set -g status-left-style "#{?client_prefix, bg=#cba6f7 fg=#1e1e2e, fg=default regular}" # Make it mauve and bold when the prefix key is active

set -g status-right "#{?window_zoomed_flag,  ,} #{host} #[fg=#cdd6f4,bg=#313244] %a %d %b #[bg=default] %H:%M %Z " # Use strftime variables
set -g status-right-style 'fg=#cdd6f4'

set -g window-status-format "#[fg=#6c7086,bg=default] #I #[fg=#6c7086,bg=default] #W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I #[fg=#cdd6f4,bg=#313244,bold] #W "
set -g window-status-current-style default

setw -g window-status-bell-style 'fg=#1e1e2e bg=#f38ba8 bold'

# Length of status lines
set -g status-left-length 30
set -g status-right-length 150

# messages
set -g message-style 'fg=#f9e2af bg=#11111b bold'
